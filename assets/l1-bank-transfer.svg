<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="404" viewBox="0 0 1200 404" role="img"><title>银行两步转账的三次状态快照</title><defs><marker id="head" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#126d72"/></marker><marker id="gold" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#9a6427"/></marker></defs><rect width="1200" height="404" fill="white"/><g font-family="Arial, PingFang SC, Hiragino Sans GB, sans-serif"><text x="26" y="37" fill="#203d50" font-size="25" font-weight="600" text-anchor="start">一笔转账经过两个事件，中间状态也必须满足不变式</text><rect x="26" y="110" width="350" height="180" rx="12" fill="#f0f6f6" stroke="#b4cece" stroke-width="1.6"/><text x="46" y="145" fill="#203d50" font-size="23" font-weight="600" text-anchor="start">扣款之前</text><text x="46" y="190" fill="#203d50" font-size="19" font-weight="400" text-anchor="start">balance(u)=4   balance(w)=0</text><text x="46" y="226" fill="#203d50" font-size="20" font-weight="400" text-anchor="start">trans = ∅</text><text x="46" y="264" fill="#536872" font-size="18" font-weight="400" text-anchor="start">两张在途映射均为空</text><rect x="425" y="110" width="350" height="180" rx="12" fill="#f0f6f6" stroke="#b4cece" stroke-width="1.6"/><text x="445" y="145" fill="#203d50" font-size="23" font-weight="600" text-anchor="start">扣款后，尚未到账</text><text x="445" y="190" fill="#203d50" font-size="19" font-weight="400" text-anchor="start">balance(u)=1   balance(w)=0</text><text x="445" y="226" fill="#203d50" font-size="20" font-weight="400" text-anchor="start">trans = {t1}</text><text x="445" y="264" fill="#126d72" font-size="20" font-weight="400" text-anchor="start">目标 w，金额 3</text><rect x="824" y="110" width="350" height="180" rx="12" fill="#f0f6f6" stroke="#b4cece" stroke-width="1.6"/><text x="844" y="145" fill="#203d50" font-size="23" font-weight="600" text-anchor="start">到账之后</text><text x="844" y="190" fill="#203d50" font-size="19" font-weight="400" text-anchor="start">balance(u)=1   balance(w)=3</text><text x="844" y="226" fill="#203d50" font-size="20" font-weight="400" text-anchor="start">trans = ∅</text><text x="844" y="264" fill="#536872" font-size="18" font-weight="400" text-anchor="start">两张在途映射均为空</text><path d="M376 200 L419 200" fill="none" stroke="#126d72" stroke-width="2.6" marker-end="url(#head)"/><text x="398" y="92" fill="#126d72" font-size="21" font-weight="400" text-anchor="middle">move1</text><path d="M775 200 L818 200" fill="none" stroke="#126d72" stroke-width="2.6" marker-end="url(#head)"/><text x="797" y="92" fill="#126d72" font-size="21" font-weight="400" text-anchor="middle">move2</text><text x="26" y="334" fill="#536872" font-size="21" font-weight="400" text-anchor="start">示例容量 c=5。u、w 均已开户，由 deposit(u,4) 得到左侧余额。</text><text x="26" y="370" fill="#536872" font-size="21" font-weight="400" text-anchor="start">move1 取 a=u、q=3、b=w、t=t1；move2 读取同一条在途记录并清除它。</text></g></svg>