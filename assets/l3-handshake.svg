<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="558" viewBox="0 0 1200 558" role="img"><title>弱强响应状态路径及短脉冲</title><defs><marker id="head" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#126d72"/></marker><marker id="gold" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#9a6427"/></marker></defs><rect width="1200" height="558" fill="white"/><g font-family="Arial, PingFang SC, Hiragino Sans GB, sans-serif"><text x="26" y="37" fill="#203d50" font-size="25" font-weight="600" text-anchor="start">弱响应与强响应怎样处理一次短脉冲</text><text x="26" y="98" fill="#203d50" font-size="25" font-weight="600" text-anchor="start">弱响应</text><text x="26" y="137" fill="#536872" font-size="21" font-weight="400" text-anchor="start">输入可以先回落。</text><text x="26" y="173" fill="#536872" font-size="21" font-weight="400" text-anchor="start">响应可能来不及采样。</text><rect x="360" y="84" width="170" height="72" rx="12" fill="#f0f6f6" stroke="#b4cece" stroke-width="1.6"/><text x="445" y="130" fill="#203d50" font-size="27" font-weight="400" text-anchor="middle">(0,0)</text><rect x="670" y="84" width="170" height="72" rx="12" fill="#f0f6f6" stroke="#b4cece" stroke-width="1.6"/><text x="755" y="130" fill="#203d50" font-size="27" font-weight="400" text-anchor="middle">(1,0)</text><rect x="980" y="84" width="170" height="72" rx="12" fill="#f0f6f6" stroke="#b4cece" stroke-width="1.6"/><text x="1065" y="130" fill="#203d50" font-size="27" font-weight="400" text-anchor="middle">(0,0)</text><path d="M530 120 L664 120" fill="none" stroke="#126d72" stroke-width="2.6" marker-end="url(#head)"/><text x="596" y="99" fill="#126d72" font-size="20" font-weight="400" text-anchor="middle">a_on</text><path d="M840 120 L974 120" fill="none" stroke="#126d72" stroke-width="2.6" marker-end="url(#head)"/><text x="906" y="99" fill="#126d72" font-size="20" font-weight="400" text-anchor="middle">a_off</text><text x="900" y="194" fill="#9a6427" font-size="22" font-weight="400" text-anchor="middle">ca=1，cr=0，脉冲未被响应</text><text x="26" y="270" fill="#203d50" font-size="25" font-weight="600" text-anchor="start">强响应</text><text x="26" y="310" fill="#536872" font-size="21" font-weight="400" text-anchor="start">每次输入变化都等待相应的反馈。</text><rect x="34" y="350" width="178" height="78" rx="12" fill="#f0f6f6" stroke="#b4cece" stroke-width="1.6"/><text x="123" y="398" fill="#203d50" font-size="27" font-weight="400" text-anchor="middle">(0,0)</text><path d="M212 389 L264 389" fill="none" stroke="#126d72" stroke-width="2.6" marker-end="url(#head)"/><text x="238" y="339" fill="#126d72" font-size="20" font-weight="400" text-anchor="middle">a_on</text><rect x="272" y="350" width="178" height="78" rx="12" fill="#f0f6f6" stroke="#b4cece" stroke-width="1.6"/><text x="361" y="398" fill="#203d50" font-size="27" font-weight="400" text-anchor="middle">(1,0)</text><path d="M450 389 L502 389" fill="none" stroke="#126d72" stroke-width="2.6" marker-end="url(#head)"/><text x="476" y="339" fill="#126d72" font-size="20" font-weight="400" text-anchor="middle">r_on</text><rect x="510" y="350" width="178" height="78" rx="12" fill="#f0f6f6" stroke="#b4cece" stroke-width="1.6"/><text x="599" y="398" fill="#203d50" font-size="27" font-weight="400" text-anchor="middle">(1,1)</text><path d="M688 389 L740 389" fill="none" stroke="#126d72" stroke-width="2.6" marker-end="url(#head)"/><text x="714" y="339" fill="#126d72" font-size="20" font-weight="400" text-anchor="middle">a_off</text><rect x="748" y="350" width="178" height="78" rx="12" fill="#f0f6f6" stroke="#b4cece" stroke-width="1.6"/><text x="837" y="398" fill="#203d50" font-size="27" font-weight="400" text-anchor="middle">(0,1)</text><path d="M926 389 L978 389" fill="none" stroke="#126d72" stroke-width="2.6" marker-end="url(#head)"/><text x="952" y="339" fill="#126d72" font-size="20" font-weight="400" text-anchor="middle">r_off</text><rect x="986" y="350" width="178" height="78" rx="12" fill="#f0f6f6" stroke="#b4cece" stroke-width="1.6"/><text x="1075" y="398" fill="#203d50" font-size="27" font-weight="400" text-anchor="middle">(0,0)</text><text x="26" y="479" fill="#536872" font-size="22" font-weight="400" text-anchor="start">状态按 (a,r) 书写。在 (1,0) 中，a_off 被禁止，必须先等 r_on。</text><text x="26" y="521" fill="#536872" font-size="21" font-weight="400" text-anchor="start">强同步的状态限制保证握手次序；调度是否最终执行某步还需要进展假设。</text></g></svg>