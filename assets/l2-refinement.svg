<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="604" viewBox="0 0 1200 604" role="img"><title>单车道桥四层精化与新增信息</title><defs><marker id="head" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#126d72"/></marker><marker id="gold" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#9a6427"/></marker></defs><rect width="1200" height="604" fill="white"/><g font-family="Arial, PingFang SC, Hiragino Sans GB, sans-serif"><text x="26" y="37" fill="#203d50" font-size="25" font-weight="600" text-anchor="start">把同一个安全要求逐层落实到控制器能看见的信息</text><rect x="40" y="86" width="1120" height="85" rx="12" fill="#f0f6f6" stroke="#b4cece" stroke-width="1.6"/><text x="60" y="121" fill="#203d50" font-size="24" font-weight="600" text-anchor="start">M0_Capacity</text><text x="352" y="119" fill="#126d72" font-size="22" font-weight="400" text-anchor="start">n</text><text x="352" y="150" fill="#536872" font-size="21" font-weight="400" text-anchor="start">总量上限 n≤d</text><path d="M168 171 L168 195" fill="none" stroke="#126d72" stroke-width="2.6" marker-end="url(#head)"/><rect x="40" y="198" width="1120" height="85" rx="12" fill="#f0f6f6" stroke="#b4cece" stroke-width="1.6"/><text x="60" y="233" fill="#203d50" font-size="24" font-weight="600" text-anchor="start">M1_Bridge</text><text x="352" y="231" fill="#126d72" font-size="22" font-weight="400" text-anchor="start">a，b，c</text><text x="352" y="262" fill="#536872" font-size="21" font-weight="400" text-anchor="start">位置与单向性；n=a+b+c</text><path d="M168 283 L168 307" fill="none" stroke="#126d72" stroke-width="2.6" marker-end="url(#head)"/><rect x="40" y="310" width="1120" height="85" rx="12" fill="#f0f6f6" stroke="#b4cece" stroke-width="1.6"/><text x="60" y="345" fill="#203d50" font-size="24" font-weight="600" text-anchor="start">M2_Lights</text><text x="352" y="343" fill="#126d72" font-size="22" font-weight="400" text-anchor="start">两盏灯与 pass 标志</text><text x="352" y="374" fill="#536872" font-size="21" font-weight="400" text-anchor="start">用灯放行；用 pass 排除反复空换灯</text><path d="M168 395 L168 419" fill="none" stroke="#126d72" stroke-width="2.6" marker-end="url(#head)"/><rect x="40" y="422" width="1120" height="85" rx="12" fill="#f0f6f6" stroke="#b4cece" stroke-width="1.6"/><text x="60" y="457" fill="#203d50" font-size="24" font-weight="600" text-anchor="start">M3_Sensors</text><text x="352" y="455" fill="#126d72" font-size="22" font-weight="400" text-anchor="start">实际 A/B/C、探头与消息</text><text x="352" y="486" fill="#536872" font-size="21" font-weight="400" text-anchor="start">解释逻辑与实际的差值，证明现场安全</text><text x="40" y="570" fill="#536872" font-size="22" font-weight="400" text-anchor="start">每一条向下的连接，都要检查守卫强化、动作模拟与新增状态的不变式。</text></g></svg>