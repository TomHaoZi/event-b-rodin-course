<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="718" viewBox="0 0 1200 718" role="img"><title>压力机最终按钮关门接合分离开门的命令反馈路径</title><defs><marker id="head" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#126d72"/></marker><marker id="gold" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#9a6427"/></marker></defs><rect width="1200" height="718" fill="white"/><g font-family="Arial, PingFang SC, Hiragino Sans GB, sans-serif"><text x="26" y="37" fill="#203d50" font-size="25" font-weight="600" text-anchor="start">Press7 的关门压制与停止取件</text><text x="26" y="80" fill="#536872" font-size="21" font-weight="400" text-anchor="start">绿色实线为控制器命令处理，棕色虚线为设备动作与反馈。</text><text x="26" y="135" fill="#203d50" font-size="24" font-weight="600" text-anchor="start">按 B3</text><rect x="150" y="108" width="250" height="96" rx="12" fill="#f0f6f6" stroke="#b4cece" stroke-width="1.6"/><text x="275" y="145" fill="#203d50" font-size="24" font-weight="600" text-anchor="middle">命令关门</text><text x="275" y="181" fill="#536872" font-size="18" font-weight="400" text-anchor="middle">treat_close_door；m≔1</text><rect x="515" y="108" width="250" height="96" rx="12" fill="#f0f6f6" stroke="#b4cece" stroke-width="1.6"/><text x="640" y="145" fill="#203d50" font-size="24" font-weight="600" text-anchor="middle">确认门已关</text><text x="640" y="181" fill="#536872" font-size="18" font-weight="400" text-anchor="middle">door_close</text><rect x="880" y="108" width="250" height="96" rx="12" fill="#f0f6f6" stroke="#b4cece" stroke-width="1.6"/><text x="1005" y="145" fill="#203d50" font-size="24" font-weight="600" text-anchor="middle">命令接合</text><text x="1005" y="181" fill="#536872" font-size="18" font-weight="400" text-anchor="middle">treat_start_clutch；m≔0</text><path d="M93 155 L144 155" fill="none" stroke="#126d72" stroke-width="2.6" marker-end="url(#head)"/><path d="M400 155 L509 155" fill="none" stroke="#9a6427" stroke-width="2.6" stroke-dasharray="7 5" marker-end="url(#gold)"/><path d="M765 155 L874 155" fill="none" stroke="#126d72" stroke-width="2.6" marker-end="url(#head)"/><path d="M1005 204 L1005 257" fill="none" stroke="#9a6427" stroke-width="2.6" stroke-dasharray="7 5" marker-end="url(#gold)"/><text x="1005" y="288" fill="#9a6427" font-size="21" font-weight="400" text-anchor="middle">clutch_start 确认接合</text><text x="26" y="370" fill="#203d50" font-size="24" font-weight="600" text-anchor="start">按 B4</text><rect x="150" y="338" width="250" height="96" rx="12" fill="#f0f6f6" stroke="#b4cece" stroke-width="1.6"/><text x="275" y="375" fill="#203d50" font-size="24" font-weight="600" text-anchor="middle">命令分离</text><text x="275" y="411" fill="#536872" font-size="18" font-weight="400" text-anchor="middle">treat_stop_clutch</text><rect x="515" y="338" width="250" height="96" rx="12" fill="#f0f6f6" stroke="#b4cece" stroke-width="1.6"/><text x="640" y="375" fill="#203d50" font-size="24" font-weight="600" text-anchor="middle">确认离合器分离</text><text x="640" y="411" fill="#536872" font-size="18" font-weight="400" text-anchor="middle">clutch_stop</text><rect x="880" y="338" width="250" height="96" rx="12" fill="#f0f6f6" stroke="#b4cece" stroke-width="1.6"/><text x="1005" y="375" fill="#203d50" font-size="24" font-weight="600" text-anchor="middle">命令开门</text><text x="1005" y="411" fill="#536872" font-size="18" font-weight="400" text-anchor="middle">treat_open_door</text><path d="M93 385 L144 385" fill="none" stroke="#126d72" stroke-width="2.6" marker-end="url(#head)"/><path d="M400 385 L509 385" fill="none" stroke="#9a6427" stroke-width="2.6" stroke-dasharray="7 5" marker-end="url(#gold)"/><path d="M765 385 L874 385" fill="none" stroke="#126d72" stroke-width="2.6" marker-end="url(#head)"/><path d="M1005 434 L1005 481" fill="none" stroke="#9a6427" stroke-width="2.6" stroke-dasharray="7 5" marker-end="url(#gold)"/><text x="1005" y="515" fill="#9a6427" font-size="21" font-weight="400" text-anchor="middle">door_open 确认门已开</text><rect x="26" y="552" width="1148" height="136" rx="12" fill="#f7f5ec" stroke="#d7c9a3" stroke-width="1.6"/><text x="48" y="589" fill="#203d50" font-size="23" font-weight="600" text-anchor="start">反馈上的安全关系</text><text x="48" y="628" fill="#203d50" font-size="22" font-weight="400" text-anchor="start">clutch_sensor=engaged  ⇒  door_sensor=closed  ⇒  motor_sensor=working</text><text x="48" y="667" fill="#536872" font-size="21" font-weight="400" text-anchor="start">B1、B2 负责电机启停。处理命令前还要满足模型中的反馈与联锁守卫。</text></g></svg>