<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="558" viewBox="0 0 1200 558" role="img"><title>单车道桥位置计数与四个边界事件</title><defs><marker id="head" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#126d72"/></marker><marker id="gold" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#9a6427"/></marker></defs><rect width="1200" height="558" fill="white"/><g font-family="Arial, PingFang SC, Hiragino Sans GB, sans-serif"><text x="26" y="37" fill="#203d50" font-size="25" font-weight="600" text-anchor="start">单车道桥的三个计数位置</text><text x="26" y="76" fill="#536872" font-size="22" font-weight="400" text-anchor="start">ML 是大陆端，IL 是岛端；事件名中的 in / out 按所在端命名。</text><rect x="32" y="125" width="220" height="310" rx="12" fill="#f1f5f7" stroke="#b4cece" stroke-width="1.6"/><text x="142" y="177" fill="#203d50" font-size="28" font-weight="600" text-anchor="middle">大陆 ML</text><text x="142" y="215" fill="#536872" font-size="21" font-weight="400" text-anchor="middle">系统边界之外</text><rect x="900" y="125" width="260" height="310" rx="12" fill="#eef5e9" stroke="#b4cece" stroke-width="1.6"/><text x="1030" y="177" fill="#203d50" font-size="28" font-weight="600" text-anchor="middle">岛 IL</text><text x="1030" y="223" fill="#126d72" font-size="24" font-weight="400" text-anchor="middle">岛内车辆数 b</text><rect x="295" y="166" width="565" height="235" rx="12" fill="#e8f2f5" stroke="#b4cece" stroke-width="1.6"/><rect x="315" y="195" width="525" height="170" rx="12" fill="#fafafa" stroke="#afbdc2" stroke-width="1.6"/><text x="577" y="398" fill="#536872" font-size="21" font-weight="400" text-anchor="middle">同一座桥，每次只允许一个方向</text><path d="M180 266 L990 266" fill="none" stroke="#126d72" stroke-width="2.6" marker-end="url(#head)"/><text x="578" y="248" fill="#126d72" font-size="23" font-weight="400" text-anchor="middle">往岛行驶的桥上车辆 a</text><text x="277" y="245" fill="#126d72" font-size="21" font-weight="400" text-anchor="middle">ML_out</text><text x="872" y="245" fill="#126d72" font-size="21" font-weight="400" text-anchor="middle">IL_in</text><path d="M990 327 L180 327" fill="none" stroke="#126d72" stroke-width="2.6" marker-end="url(#head)"/><text x="578" y="351" fill="#126d72" font-size="23" font-weight="400" text-anchor="middle">往大陆行驶的桥上车辆 c</text><text x="876" y="355" fill="#126d72" font-size="21" font-weight="400" text-anchor="middle">IL_out</text><text x="277" y="355" fill="#126d72" font-size="21" font-weight="400" text-anchor="middle">ML_in</text><text x="26" y="484" fill="#203d50" font-size="23" font-weight="600" text-anchor="start">总量连接式 n=a+b+c；容量 a+b+c≤d；桥面方向约束 a=0 ∨ c=0。</text><text x="26" y="525" fill="#536872" font-size="21" font-weight="400" text-anchor="start">同向可以有多辆车。IL_in、IL_out 只改变车的位置，桥与岛合计的车数不变。</text></g></svg>