<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="488" viewBox="0 0 1200 488" role="img"><title>序列查找游标前缀和命中位置示意</title><defs><marker id="head" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#126d72"/></marker><marker id="gold" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#9a6427"/></marker></defs><rect width="1200" height="488" fill="white"/><g font-family="Arial, PingFang SC, Hiragino Sans GB, sans-serif"><text x="26" y="37" fill="#203d50" font-size="25" font-weight="600" text-anchor="start">顺序查找的游标与已扫描前缀</text><text x="26" y="78" fill="#536872" font-size="22" font-weight="400" text-anchor="start">n=4，目标 v=乙；执行一次 advance 后 j=1，接下来检查 j+1=2。</text><rect x="100" y="132" width="222" height="92" rx="12" fill="#e3f2ef" stroke="#b4cece" stroke-width="1.6"/><text x="211" y="119" fill="#536872" font-size="20" font-weight="400" text-anchor="middle">下标 1</text><text x="211" y="192" fill="#203d50" font-size="34" font-weight="600" text-anchor="middle">甲</text><rect x="360" y="132" width="222" height="92" rx="12" fill="#fff0d9" stroke="#b4cece" stroke-width="1.6"/><text x="471" y="119" fill="#536872" font-size="20" font-weight="400" text-anchor="middle">下标 2</text><text x="471" y="192" fill="#203d50" font-size="34" font-weight="600" text-anchor="middle">乙</text><rect x="620" y="132" width="222" height="92" rx="12" fill="#f5f7f8" stroke="#b4cece" stroke-width="1.6"/><text x="731" y="119" fill="#536872" font-size="20" font-weight="400" text-anchor="middle">下标 3</text><text x="731" y="192" fill="#203d50" font-size="34" font-weight="600" text-anchor="middle">乙</text><rect x="880" y="132" width="222" height="92" rx="12" fill="#f5f7f8" stroke="#b4cece" stroke-width="1.6"/><text x="991" y="119" fill="#536872" font-size="20" font-weight="400" text-anchor="middle">下标 4</text><text x="991" y="192" fill="#203d50" font-size="34" font-weight="600" text-anchor="middle">丙</text><text x="211" y="263" fill="#126d72" font-size="21" font-weight="400" text-anchor="middle">已检查，f(1)≠v</text><text x="471" y="263" fill="#9a6427" font-size="21" font-weight="400" text-anchor="middle">当前候选 j+1</text><text x="864" y="263" fill="#536872" font-size="21" font-weight="400" text-anchor="middle">尚未扫描</text><path d="M471 282 L471 330" fill="none" stroke="#126d72" stroke-width="2.6" marker-end="url(#head)"/><text x="471" y="365" fill="#126d72" font-size="23" font-weight="400" text-anchor="middle">f(j+1)=v，触发 search</text><text x="471" y="404" fill="#203d50" font-size="22" font-weight="400" text-anchor="middle">见证 k=j+1=2，动作 i≔2，j 保持 1</text><text x="26" y="454" fill="#536872" font-size="21" font-weight="400" text-anchor="start">prefix 不变式保证下标 1‥j 都未命中，因此这次返回第一个匹配位置。</text></g></svg>