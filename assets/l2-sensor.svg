<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img"><title>传感器采样实际车数与逻辑车数的四次状态快照</title><defs><marker id="head" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#126d72"/></marker><marker id="gold" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#9a6427"/></marker></defs><rect width="1200" height="500" fill="white"/><g font-family="Arial, PingFang SC, Hiragino Sans GB, sans-serif"><text x="26" y="37" fill="#203d50" font-size="25" font-weight="600" text-anchor="start">大陆端进桥通道的一次采样与软件记账</text><text x="26" y="77" fill="#536872" font-size="21" font-weight="400" text-anchor="start">取初始 a=A=0，并假设大陆绿灯已打开。sr 表示 ML_OUT_SR，msg 表示 ml_out_10。</text><rect x="26" y="130" width="260" height="204" rx="12" fill="#f0f6f6" stroke="#b4cece" stroke-width="1.6"/><text x="156" y="165" fill="#203d50" font-size="23" font-weight="600" text-anchor="middle">空闲</text><text x="46" y="204" fill="#203d50" font-size="21" font-weight="400" text-anchor="start">sr = off</text><text x="46" y="241" fill="#203d50" font-size="20" font-weight="400" text-anchor="start">msg = FALSE</text><text x="46" y="277" fill="#126d72" font-size="21" font-weight="400" text-anchor="start">A=0，a=0</text><text x="46" y="314" fill="#536872" font-size="18" font-weight="400" text-anchor="start">phase = 2</text><path d="M286 226 L318 226" fill="none" stroke="#126d72" stroke-width="2.6" marker-end="url(#head)"/><rect x="324" y="130" width="260" height="204" rx="12" fill="#f0f6f6" stroke="#b4cece" stroke-width="1.6"/><text x="454" y="165" fill="#203d50" font-size="23" font-weight="600" text-anchor="middle">压住探头</text><text x="344" y="204" fill="#203d50" font-size="21" font-weight="400" text-anchor="start">sr = on</text><text x="344" y="241" fill="#203d50" font-size="20" font-weight="400" text-anchor="start">msg = FALSE</text><text x="344" y="277" fill="#126d72" font-size="21" font-weight="400" text-anchor="start">A=0，a=0</text><text x="344" y="314" fill="#536872" font-size="18" font-weight="400" text-anchor="start">phase = 1</text><path d="M584 226 L616 226" fill="none" stroke="#126d72" stroke-width="2.6" marker-end="url(#head)"/><rect x="622" y="130" width="260" height="204" rx="12" fill="#f0f6f6" stroke="#b4cece" stroke-width="1.6"/><text x="752" y="165" fill="#203d50" font-size="23" font-weight="600" text-anchor="middle">离开并上桥</text><text x="642" y="204" fill="#203d50" font-size="21" font-weight="400" text-anchor="start">sr = off</text><text x="642" y="241" fill="#203d50" font-size="20" font-weight="400" text-anchor="start">msg = TRUE</text><text x="642" y="277" fill="#126d72" font-size="21" font-weight="400" text-anchor="start">A=1，a=0</text><text x="642" y="314" fill="#536872" font-size="18" font-weight="400" text-anchor="start">phase = 0</text><path d="M882 226 L914 226" fill="none" stroke="#126d72" stroke-width="2.6" marker-end="url(#head)"/><rect x="920" y="130" width="260" height="204" rx="12" fill="#f0f6f6" stroke="#b4cece" stroke-width="1.6"/><text x="1050" y="165" fill="#203d50" font-size="23" font-weight="600" text-anchor="middle">软件处理后</text><text x="940" y="204" fill="#203d50" font-size="21" font-weight="400" text-anchor="start">sr = off</text><text x="940" y="241" fill="#203d50" font-size="20" font-weight="400" text-anchor="start">msg = FALSE</text><text x="940" y="277" fill="#126d72" font-size="21" font-weight="400" text-anchor="start">A=1，a=1</text><text x="940" y="314" fill="#536872" font-size="18" font-weight="400" text-anchor="start">phase = 2</text><text x="306" y="113" fill="#126d72" font-size="18" font-weight="400" text-anchor="middle">ML_out_arr</text><text x="604" y="113" fill="#126d72" font-size="18" font-weight="400" text-anchor="middle">ML_out_dep</text><text x="902" y="113" fill="#126d72" font-size="18" font-weight="400" text-anchor="middle">ML_out1 / ML_out2</text><text x="26" y="382" fill="#203d50" font-size="22" font-weight="600" text-anchor="start">物理 dep 先改变 A 并留下消息；控制器处理消息时才改变 a。</text><text x="26" y="424" fill="#536872" font-size="21" font-weight="400" text-anchor="start">图中两次物理步让 phase 严格下降；软件处理后通道重新具备采样条件。</text><text x="26" y="462" fill="#536872" font-size="21" font-weight="400" text-anchor="start">此处其他通道无待处理消息。完整模型分别对 A、B、C 检查四种消息组合。</text></g></svg>