<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1018" viewBox="0 0 1200 1018" role="img"><title>压力机八层精化新增信息与需求</title><defs><marker id="head" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#126d72"/></marker><marker id="gold" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#9a6427"/></marker></defs><rect width="1200" height="1018" fill="white"/><g font-family="Arial, PingFang SC, Hiragino Sans GB, sans-serif"><text x="26" y="37" fill="#203d50" font-size="25" font-weight="600" text-anchor="start">压力机的八层精化分别增加什么</text><rect x="50" y="75" width="1100" height="83" rx="12" fill="#f0f6f6" stroke="#b4cece" stroke-width="1.6"/><text x="72" y="110" fill="#203d50" font-size="25" font-weight="600" text-anchor="start">Press0</text><text x="305" y="109" fill="#126d72" font-size="22" font-weight="400" text-anchor="start">电机命令与反馈</text><text x="305" y="141" fill="#536872" font-size="20" font-weight="400" text-anchor="start">区分要求转动、实际转动</text><path d="M170 158 L170 182" fill="none" stroke="#126d72" stroke-width="2.6" marker-end="url(#head)"/><rect x="50" y="184" width="1100" height="83" rx="12" fill="#f0f6f6" stroke="#b4cece" stroke-width="1.6"/><text x="72" y="219" fill="#203d50" font-size="25" font-weight="600" text-anchor="start">Press1</text><text x="305" y="218" fill="#126d72" font-size="22" font-weight="400" text-anchor="start">启动与停止按钮</text><text x="305" y="250" fill="#536872" font-size="20" font-weight="400" text-anchor="start">用 impulse 记忆本次按下是否已处理</text><path d="M170 267 L170 291" fill="none" stroke="#126d72" stroke-width="2.6" marker-end="url(#head)"/><rect x="50" y="293" width="1100" height="83" rx="12" fill="#f0f6f6" stroke="#b4cece" stroke-width="1.6"/><text x="72" y="328" fill="#203d50" font-size="25" font-weight="600" text-anchor="start">Press2</text><text x="305" y="327" fill="#126d72" font-size="22" font-weight="400" text-anchor="start">离合器命令与反馈</text><text x="305" y="359" fill="#536872" font-size="20" font-weight="400" text-anchor="start">增加第二套设备握手</text><path d="M170 376 L170 400" fill="none" stroke="#126d72" stroke-width="2.6" marker-end="url(#head)"/><rect x="50" y="402" width="1100" height="83" rx="12" fill="#f0f6f6" stroke="#b4cece" stroke-width="1.6"/><text x="72" y="437" fill="#203d50" font-size="25" font-weight="600" text-anchor="start">Press3</text><text x="305" y="436" fill="#126d72" font-size="22" font-weight="400" text-anchor="start">电机与离合器互锁</text><text x="305" y="468" fill="#536872" font-size="20" font-weight="400" text-anchor="start">接合离合器时电机必须工作</text><path d="M170 485 L170 509" fill="none" stroke="#126d72" stroke-width="2.6" marker-end="url(#head)"/><rect x="50" y="511" width="1100" height="83" rx="12" fill="#f0f6f6" stroke="#b4cece" stroke-width="1.6"/><text x="72" y="546" fill="#203d50" font-size="25" font-weight="600" text-anchor="start">Press4</text><text x="305" y="545" fill="#126d72" font-size="22" font-weight="400" text-anchor="start">防护门命令与反馈</text><text x="305" y="577" fill="#536872" font-size="20" font-weight="400" text-anchor="start">增加第三套设备握手</text><path d="M170 594 L170 618" fill="none" stroke="#126d72" stroke-width="2.6" marker-end="url(#head)"/><rect x="50" y="620" width="1100" height="83" rx="12" fill="#f0f6f6" stroke="#b4cece" stroke-width="1.6"/><text x="72" y="655" fill="#203d50" font-size="25" font-weight="600" text-anchor="start">Press5</text><text x="305" y="654" fill="#126d72" font-size="22" font-weight="400" text-anchor="start">门、电机与离合器互锁</text><text x="305" y="686" fill="#536872" font-size="20" font-weight="400" text-anchor="start">接合时门已关，关门时电机工作</text><path d="M170 703 L170 727" fill="none" stroke="#126d72" stroke-width="2.6" marker-end="url(#head)"/><rect x="50" y="729" width="1100" height="83" rx="12" fill="#f0f6f6" stroke="#b4cece" stroke-width="1.6"/><text x="72" y="764" fill="#203d50" font-size="25" font-weight="600" text-anchor="start">Press6</text><text x="305" y="763" fill="#126d72" font-size="22" font-weight="400" text-anchor="start">一轮压制的历史位 m</text><text x="305" y="795" fill="#536872" font-size="20" font-weight="400" text-anchor="start">一次关门只服务一次接合周期</text><path d="M170 812 L170 836" fill="none" stroke="#126d72" stroke-width="2.6" marker-end="url(#head)"/><rect x="50" y="838" width="1100" height="83" rx="12" fill="#f0f6f6" stroke="#b4cece" stroke-width="1.6"/><text x="72" y="873" fill="#203d50" font-size="25" font-weight="600" text-anchor="start">Press7</text><text x="305" y="872" fill="#126d72" font-size="22" font-weight="400" text-anchor="start">离合器按钮 B3 与 B4</text><text x="305" y="904" fill="#536872" font-size="20" font-weight="400" text-anchor="start">B3 先关门再接合，B4 先分离再开门</text><text x="50" y="982" fill="#536872" font-size="21" font-weight="400" text-anchor="start">每层在父机行为之上增加状态或限制，逐项检查新增不变式和事件模拟。</text></g></svg>