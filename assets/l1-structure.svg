<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="522" viewBox="0 0 1200 522" role="img"><title>上下文机器事件的结构与证明依赖</title><defs><marker id="head" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#126d72"/></marker><marker id="gold" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#9a6427"/></marker></defs><rect width="1200" height="522" fill="white"/><g font-family="Arial, PingFang SC, Hiragino Sans GB, sans-serif"><text x="26" y="37" fill="#203d50" font-size="25" font-weight="600" text-anchor="start">从上下文到一次状态变化</text><rect x="26" y="82" width="335" height="314" rx="12" fill="#f3f6ed" stroke="#c0cfb3" stroke-width="1.6"/><text x="48" y="123" fill="#203d50" font-size="25" font-weight="600" text-anchor="start">Context 静态环境</text><text x="48" y="173" fill="#126d72" font-size="23" font-weight="400" text-anchor="start">集合、常量、公理</text><text x="48" y="216" fill="#203d50" font-size="20" font-weight="400" text-anchor="start">例如容量 d 与 d∈ℕ、d&gt;0</text><text x="48" y="265" fill="#536872" font-size="21" font-weight="400" text-anchor="start">同一次执行中保持固定</text><text x="48" y="357" fill="#536872" font-size="21" font-weight="400" text-anchor="start">机器通过 SEES 引用</text><path d="M436 237 L367 237" fill="none" stroke="#126d72" stroke-width="2.6" marker-end="url(#head)"/><text x="400" y="217" fill="#126d72" font-size="17" font-weight="400" text-anchor="middle">SEES</text><rect x="442" y="82" width="732" height="314" rx="12" fill="#f0f6f6" stroke="#b4cece" stroke-width="1.6"/><text x="466" y="123" fill="#203d50" font-size="25" font-weight="600" text-anchor="start">Machine 动态系统</text><text x="466" y="170" fill="#203d50" font-size="22" font-weight="400" text-anchor="start">变量 n 保存状态；不变式要求 0≤n≤d</text><rect x="466" y="194" width="681" height="174" rx="12" fill="#ffffff" stroke="#b4cece" stroke-width="1.6"/><text x="487" y="229" fill="#203d50" font-size="23" font-weight="600" text-anchor="start">Event ML_out</text><text x="487" y="270" fill="#126d72" font-size="22" font-weight="400" text-anchor="start">Guard  n&lt;d</text><text x="487" y="310" fill="#126d72" font-size="22" font-weight="400" text-anchor="start">Action  n≔n+1</text><text x="487" y="348" fill="#536872" font-size="20" font-weight="400" text-anchor="start">守卫为真时才允许发生，动作一次完成</text><text x="26" y="444" fill="#203d50" font-size="23" font-weight="600" text-anchor="start">初始化先建立不变式；之后每个可发生的事件都必须保持不变式。</text><text x="26" y="486" fill="#536872" font-size="21" font-weight="400" text-anchor="start">证明用公理、旧状态不变式与守卫，推出动作执行后的目标。</text></g></svg>